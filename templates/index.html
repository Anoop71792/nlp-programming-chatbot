<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="chatbot-container">
            <div class="chatbot-header">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h2>STUDENT ASSISTANT</h2>
                </div>
                <p class="tagline">Your personal guide to study resources</p>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div id="chatbox">
                    <div class="message bot-message">
                        <div class="message-content">
                            <p>Hi there! I'm your Student Assistant bot. Ask me about topics to find relevant study materials.</p>
                        </div>
                        <div class="message-time">Now</div>
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Search...">
                <button id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        
        <div class="todo-panel" id="todoPanel">
            <div class="todo-header">
                <h3><i class="fas fa-tasks"></i> To-Do List</h3>
                <button id="todoToggleBtn" class="todo-toggle-btn">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <div class="todo-content">
                <div class="todo-input-container">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                    <button id="addTaskBtn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <div class="filter-options">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                
                <ul id="taskList" class="task-list"></ul>
                
                <div class="todo-footer">
                    <span id="taskCount">0 tasks left</span>
                    <button id="clearCompletedBtn">Clear Completed</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
   
</body>
</html>
